name: flash
description: A fast, local-first RSS reader with AI-powered filtering.
version: 0.1.0+2
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Local storage ---
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.0.0

  # --- Feed parsing ---
  http: ^1.2.1
  dart_rss: ^3.0.2
  html: ^0.15.4

  # --- Background processing ---
  workmanager: ^0.9.0
  flutter_local_notifications: ^18.0.0

  # --- Google services ---
  google_sign_in: ^6.2.1
  googleapis: ^12.0.0

  # --- UI & theming ---
  dynamic_color: ^1.7.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # --- Gestures & animations ---
  flutter_slidable: ^3.1.0
  animations: ^2.0.11

  # --- Sharing ---
  share_plus: ^9.0.0

  # --- URL handling ---
  url_launcher: ^6.3.0

  # --- File access ---
  file_picker: ^8.0.7

  # --- App badge ---
  app_badge_plus: ^1.1.0

  # --- Utilities ---
  intl: any
  uuid: ^4.4.0
  collection: ^1.18.0

dependency_overrides:
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
