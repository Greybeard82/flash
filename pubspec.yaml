name: flash
description: A fast, local-first RSS reader with AI-powered filtering.
version: 0.9.8+33
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Local storage ---
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # --- Feed parsing ---
  http: ^1.2.1
  dart_rss: ^3.0.2
  html: ^0.15.4
  # OPML import/export. Already present transitively (dart_rss depends on it);
  # promoted to a direct dependency at the version already resolved in
  # pubspec.lock, so this adds nothing to the build that was not already there.
  xml: ^6.6.1

  # --- Background processing ---
  workmanager: ^0.9.0
  flutter_local_notifications: ^18.0.0

  # --- Google services ---
  # Cloud summaries go through Firebase AI Logic, not a direct Gemini call.
  # The API key lives server-side; App Check (Play Integrity) attests the
  # request came from a genuine, untampered build before it reaches Gemini.
  # See gemini_cloud_service.dart and app_check_config.dart.
  firebase_core: ^4.14.0
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.7

  # --- UI & theming ---
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # --- Sharing ---
  # Bumped 9 -> 12 because firebase_app_check_web needs `web ^1.0.0` and
  # share_plus 9 pinned `web ^0.5.0`, which made the two unresolvable. Flash
  # ships Android only, so the `web` transitive is never built — but pub
  # resolves the whole graph regardless of target platform. The upgrade costs
  # one line in share_service.dart; see the note there.
  share_plus: ^12.0.2

  # --- URL handling ---
  url_launcher: ^6.3.0

  # --- File access ---
  file_picker: ^8.0.7

  # --- App badge ---
  app_badge_plus: ^1.1.0

  # --- Utilities ---
  intl: any
  home_widget: ^0.9.4
  flutter_inappwebview: ^6.0.0

dependency_overrides:
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.3

# NOT the source of the shipped launcher icon. The icon in
# android/app/src/main/res is hand-installed vector artwork — a gradient
# background, a foreground, and a monochrome layer for Android 13 themed
# icons — none of which this tool can generate from a flat PNG. Running it
# would overwrite all three with rasterised copies and drop the monochrome
# layer. Kept, pointed at the current artwork, so that if anyone does run it
# they at least get the right picture; see
# icon/Modern RSS reader app design/flash-icon/README.md.
flutter_launcher_icons:
  android: true
  image_path: "icon/Modern RSS reader app design/flash-icon/png/flash-teal-dark-1024.png"
  adaptive_icon_background: "#14A08B"
  adaptive_icon_foreground: "icon/Modern RSS reader app design/flash-icon/png/flash-teal-dark-1024.png"
  min_sdk_android: 26

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/blocklists/

  fonts:
    - family: PT Serif
      fonts:
        - asset: assets/fonts/PTSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/PTSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/PTSerif-Italic.ttf
          weight: 400
          style: italic
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-VF.ttf
          weight: 700
    # Quiet Ink. Variable fonts, one asset per family: three families of
    # static weight sets would add several hundred KB to an APK that is
    # about to go back through Play review.
    #
    # Literata is subset. Google ships it with Greek-ext (polytonic) and
    # Vietnamese as well, which nothing Flash renders needs, and the full
    # file is 933 KB raw / 498 KB deflated.
    #
    # THE SUBSET IS NOT ABOUT FLASH'S FIVE LOCALES. It is about what a FEED
    # can contain, which is any language at all. The locales pick the UI
    # strings; the clean view renders whatever the article is written in.
    # Latin-only shipped through 0.9.6 and a Russian article in clean view
    # came out in the platform's fallback grotesque — no tofu, fully
    # readable, and simply not Literata, with a line height tuned for a face
    # that was not on screen.
    #
    # So: Latin + Cyrillic + Greek. U+0301 and U+2116 come with the Cyrillic
    # because Google's own cyrillic range carries them — the combining acute
    # is the Russian stress mark and the numero sign is ordinary punctuation
    # there.
    #
    #   Latin only              474 KB raw / 273 KB deflated
    #   + Cyrillic + Greek      740 KB raw / 416 KB deflated   <- shipped
    #   + polytonic Greek       786 KB raw / 434 KB deflated
    #
    # Polytonic (U+1F00-1FFF) is excluded on the same reasoning as CJK, at a
    # far smaller price: 270 glyphs and 46 KB for Ancient Greek, which modern
    # monotonic feeds do not use. Add U+1F00-1FFF to the line below if a feed
    # ever proves otherwise. CJK stays out for the original reason — megabytes
    # rather than kilobytes, and the platform fallback there is correct.
    #
    # Both variable axes stay intact (opsz 7-72, wght 200-900). Regenerate
    # with the command below: run against Google's Literata[opsz,wght].ttf it
    # reproduces the shipped file BYTE FOR BYTE, which is how this was checked
    # rather than assumed.
    #
    #   python -m fontTools.subset Literata[opsz,wght].ttf \
    #     --output-file=assets/fonts/Literata.ttf \
    #     --unicodes="U+0000-00FF,U+0100-017F,U+0180-024F,U+2000-206F,U+20A0-20BF,U+2122,U+2212,U+0301,U+0400-04FF,U+2116,U+0370-03FF" \
    #     --layout-features="*"
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
          weight: 400
        - asset: assets/fonts/Literata.ttf
          weight: 500
        - asset: assets/fonts/Literata.ttf
          weight: 600
        - asset: assets/fonts/Literata.ttf
          weight: 700
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-VF.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-VF.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-VF.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-VF.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-VF.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-VF.ttf
          weight: 500
