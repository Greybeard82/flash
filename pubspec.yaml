name: flash
description: A fast, local-first RSS reader with AI-powered filtering.
version: 0.1.0+2
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Local storage ---
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.0.0

  # --- Feed parsing ---
  http: ^1.2.1
  dart_rss: ^3.0.2
  html: ^0.15.4

  # --- Background processing ---
  workmanager: ^0.9.0
  flutter_local_notifications: ^18.0.0

  # --- Google services ---
  google_sign_in: ^6.2.1
  googleapis: ^12.0.0

  # --- UI & theming ---
  dynamic_color: ^1.7.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # --- Gestures & animations ---
  flutter_slidable: ^3.1.0
  animations: ^2.0.11

  # --- Sharing ---
  share_plus: ^9.0.0

  # --- URL handling ---
  url_launcher: ^6.3.0

  # --- File access ---
  file_picker: ^8.0.7

  # --- App badge ---
  app_badge_plus: ^1.1.0

  # --- Utilities ---
  intl: any
  uuid: ^4.4.0
  collection: ^1.18.0
  home_widget: ^0.9.4

dependency_overrides:
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.3

# NOT the source of the shipped launcher icon. The icon in
# android/app/src/main/res is hand-installed vector artwork — a gradient
# background, a foreground, and a monochrome layer for Android 13 themed
# icons — none of which this tool can generate from a flat PNG. Running it
# would overwrite all three with rasterised copies and drop the monochrome
# layer. Kept, pointed at the current artwork, so that if anyone does run it
# they at least get the right picture; see
# icon/Modern RSS reader app design/flash-icon/README.md.
flutter_launcher_icons:
  android: true
  image_path: "icon/Modern RSS reader app design/flash-icon/png/flash-teal-dark-1024.png"
  adaptive_icon_background: "#14A08B"
  adaptive_icon_foreground: "icon/Modern RSS reader app design/flash-icon/png/flash-teal-dark-1024.png"
  min_sdk_android: 26

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: PT Serif
      fonts:
        - asset: assets/fonts/PTSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/PTSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/PTSerif-Italic.ttf
          weight: 400
          style: italic
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-VF.ttf
          weight: 700
